[project]
name = "lstm-stock-prediction"
version = "0.1.0"
description = "基于 LSTM 的股票市场时序预测项目，含数据加载、特征工程、训练、回测完整流程"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Xavier Chen", email = "chanxaviersy@gmail.com"},
]
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "build", "dist", "data", "models", "outputs"]

[tool.black]
line-length = 100
target-version = ["py310"]
